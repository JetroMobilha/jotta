name: jota
description: "Aplicação para a eliminação de contactor e mensagem programadamente"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  cupertino_icons: ^1.0.8
  permission_handler: 11.3.1
  flutter_contacts: ^2.6.0
  shared_preferences: ^2.5.6
  json_annotation: ^4.12.0
  workmanager: ^0.10.10
  google_mobile_ads: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true
  generate: true
